name: Refresh listings

# Actions tab -> "Refresh listings" -> "Run workflow".
#
# Modes:
#   refresh  - scrape and commit (default)
#   dry-run  - scrape and print, commit nothing
#   probe    - diagnose one theater when a refresh fails

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: refresh
        options: [refresh, dry-run, probe]
      theater:
        description: "Theater to probe (probe mode only)"
        type: choice
        default: rivereast
        options: [rivereast, musicbox, siskel]

  # Uncomment for automatic weekend refreshes, once you trust it.
  # schedule:
  #   - cron: "0 22 * * 5"    # Fri 5pm Chicago
  #   - cron: "0 13 * * 6,0"  # Sat & Sun 8am Chicago

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      - name: Probe
        if: ${{ inputs.mode == 'probe' }}
        working-directory: pipeline
        run: python run.py --probe "${{ inputs.theater }}"

      - name: Dry run
        if: ${{ inputs.mode == 'dry-run' }}
        working-directory: pipeline
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: python run.py --dry-run

      # --allow-partial: a theater that fails is skipped and named in the
      # site's "Partial" banner, rather than throwing away the ones that
      # worked. Failed theaters contribute no rows, so nothing bad ships.
      - name: Scrape showtimes
        if: ${{ inputs.mode == 'refresh' }}
        working-directory: pipeline
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: python run.py --out ../src/slate.json --allow-partial

      - name: Show what changed
        if: ${{ inputs.mode == 'refresh' }}
        run: |
          python -c "
          import json
          d = json.load(open('src/slate.json'))
          shows = [s for f in d['films'] for s in f['showings']]
          seen = sorted({s.split('|')[0] for s in shows})
          print(f\"{len(d['films'])} films, {len(shows)} showings\")
          print('theaters included:', ', '.join(seen))
          print('missing:', d['partial'] or 'nothing')
          "

      - name: Commit listings
        if: ${{ inputs.mode == 'refresh' }}
        run: |
          git config user.name  "marquee-bot"
          git config user.email "marquee-bot@users.noreply.github.com"
          git add src/slate.json
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "listings $(date -u +%F)"
          git push
