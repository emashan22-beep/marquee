name: Refresh listings

# Actions tab -> "Refresh listings" -> "Run workflow".
#
# This workflow scrapes, commits, builds AND deploys, all in one run.
#
# Why it deploys itself: a commit pushed from Actions with the default
# GITHUB_TOKEN does NOT trigger other workflows. GitHub blocks that to
# prevent infinite loops. So deploy.yml never fires from this commit,
# and the site would keep serving the previous listings forever.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: refresh
        options: [refresh, dry-run, probe]
      theater:
        description: "Theater to probe (probe mode only)"
        type: choice
        default: rivereast
        options: [rivereast, musicbox, siskel]

  # Uncomment for automatic weekend refreshes, once you trust it.
  # schedule:
  #   - cron: "0 22 * * 5"    # Fri 5pm Chicago
  #   - cron: "0 13 * * 6,0"  # Sat & Sun 8am Chicago

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      - name: Probe
        if: ${{ inputs.mode == 'probe' }}
        working-directory: pipeline
        run: python run.py --probe "${{ inputs.theater }}"

      - name: Dry run
        if: ${{ inputs.mode == 'dry-run' }}
        working-directory: pipeline
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: python run.py --dry-run

      - name: Scrape showtimes
        if: ${{ inputs.mode == 'refresh' }}
        working-directory: pipeline
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: python run.py --out ../src/slate.json --allow-partial

      - name: Show what changed
        if: ${{ inputs.mode == 'refresh' }}
        run: |
          python -c "
          import json
          d = json.load(open('src/slate.json'))
          shows = [s for f in d['films'] for s in f['showings']]
          seen = sorted({s.split('|')[0] for s in shows})
          print(f\"{len(d['films'])} films, {len(shows)} showings\")
          print('fetchedAt:', d['fetchedAt'])
          print('theaters included:', ', '.join(seen))
          print('missing:', d['partial'] or 'nothing')
          "

      - name: Commit listings
        if: ${{ inputs.mode == 'refresh' }}
        run: |
          git config user.name  "marquee-bot"
          git config user.email "marquee-bot@users.noreply.github.com"
          git add src/slate.json
          if git diff --staged --quiet; then
            echo "slate.json unchanged"
          else
            git commit -m "listings $(date -u +%F)"
            git push
          fi

      # --- build and publish, in this same run -----------------------
      # Nothing else will do it: the commit above cannot trigger
      # deploy.yml, so this workflow has to finish the job itself.
      - uses: actions/setup-node@v4
        if: ${{ inputs.mode == 'refresh' }}
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
        if: ${{ inputs.mode == 'refresh' }}
      - run: npm run build
        if: ${{ inputs.mode == 'refresh' }}

      - uses: actions/configure-pages@v5
        if: ${{ inputs.mode == 'refresh' }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.mode == 'refresh' }}
        with:
          path: ./dist

  deploy:
    needs: refresh
    if: ${{ inputs.mode == 'refresh' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
